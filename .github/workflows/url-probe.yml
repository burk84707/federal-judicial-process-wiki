name: Probe candidate source URLs (read-only)

on:
  workflow_dispatch:
  push:
    paths:
      - maintenance/probe/urls.txt

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pypdf==5.1.0
      - name: Probe each URL with the source monitor's fetcher
        run: python scripts/probe_urls.py maintenance/probe/urls.txt --timeout 60
