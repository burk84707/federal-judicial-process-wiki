name: Validate public release (manual review)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/build_public.py
      - run: python scripts/validate_public.py
      - run: python -m unittest discover -s tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: federal-process-public-review
          path: dist/site/
          if-no-files-found: error
          retention-days: 30
      # No publish, repository write, automatic baseline acceptance or deployment step.
