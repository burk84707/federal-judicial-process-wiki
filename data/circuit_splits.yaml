- issue_id: supervised-release-3583e
  issue: § 3583(e) modification and early termination
  supreme_court_or_nationwide_rule: Section 3583(e) supplies eligibility, factors, and authorized actions; explanation, changed-circumstance,
    hearing, review, and collateral-attack rules may differ by circuit.
  circuit_rules:
    CA1:
      status: verified_with_limitations
      rule: The district court retains § 3583(e)(2) condition-modification jurisdiction during a pending appeal from a supervised-release revocation.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_pending_appeal_modification_jurisdiction
      local_rule: https://www.ca1.uscourts.gov/local-rules
      last_checked: '2026-08-25'
    CA2:
      status: verified_with_limitations
      rule: Consider the § 3583(e) subset of § 3553(a); a statement and record showing consideration suffice without separate findings on every
        factor.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_factor_consideration_and_explanation_proposition
      local_rule: https://www.ca2.uscourts.gov/clerk/case_filing/rules/rules_home.html
      last_checked: '2026-08-25'
    CA3:
      status: verified_with_limitations
      rule: No exceptional-or-changed-circumstance threshold; apply the statutory factors, conduct, and interest-of-justice inquiry.
      publication_status: published_precedential
      intra_circuit_conflict: published_opinion_disavows_earlier_nonprecedential_threshold_language
      local_rule: https://www.ca3.uscourts.gov/rules-and-requirements
      last_checked: '2026-08-25'
    CA4:
      status: verified_with_limitations
      rule: Early termination permits a broad conduct and interest-of-justice inquiry but is not a vehicle to collaterally attack the original
        unappealed sentence.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_scope_and_collateral_attack_limit
      local_rule: https://www.ca4.uscourts.gov/LocalRules/LocalRules.pdf
      last_checked: '2026-08-25'
    CA5:
      status: verified_with_limitations
