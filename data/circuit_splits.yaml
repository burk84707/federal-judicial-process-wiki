- issue_id: section-404-procedure
  issue: First Step Act § 404 procedure and review
  supreme_court_or_nationwide_rule: Concepcion and § 404 supply the nationwide floor, but hearing, presence, explanation, preservation, and review
    rules may require circuit authority.
  circuit_rules:
    CA1:
      status: verified_with_limitations
      rule: Deferential review absent legal benchmark error; a brief explanation understood from the full record may suffice if it shows consideration
        of nonfrivolous arguments.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_post_concepcion_propositions
      local_rule: https://www.ca1.uscourts.gov/local-rules
      last_checked: '2026-08-25'
    CA2:
      status: verified_with_limitations
      rule: No categorical requirement for a hearing at which the defendant is present before denial of a § 404 motion.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_hearing_and_presence_proposition
      local_rule: https://www.ca2.uscourts.gov/clerk/case_filing/rules/rules_home.html
      last_checked: '2026-08-25'
    CA3:
      status: verified_with_limitations
      rule: No entitlement to an in-person or plenary hearing; provide a reasonable opportunity for written sentencing arguments and enough explanation
        for review.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_post_concepcion_propositions
      local_rule: https://www.ca3.uscourts.gov/rules-and-requirements
      last_checked: '2026-08-25'
    CA4:
      status: verified_with_limitations
      rule: No mandatory reduction above a revised maximum; the record must show consideration of every nonfrivolous argument, and ambiguity can
        require remand.
      publication_status: published_precedential
      intra_circuit_conflict: collington_mandatory_reduction_rule_displaced_by_concepcion_as_recognized_in_reed
      local_rule: https://www.ca4.uscourts.gov/LocalRules/LocalRules.pdf
      last_checked: '2026-08-25'
    CA5:
      status: verified_with_limitations
      rule: Section 404(c)'s successive-motion bar is mandatory claim processing, not jurisdictional, and must be enforced when properly invoked
        after a complete prior merits review.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_section_404_c_proposition
      local_rule: https://www.ca5.uscourts.gov/rules-procedures
      last_checked: '2026-08-25'
    CA6:
      status: verified_with_limitations
      rule: Recalculate the benchmark only for Fair Sentencing Act changes, then consider relevant intervening information and explain the treatment
        of nonfrivolous arguments.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_post_concepcion_propositions
      local_rule: https://www.ca6.uscourts.gov/sites/ca6/files/documents/rules_procedures/Full%20Rules%20w%20FRAP_0.pdf
      last_checked: '2026-08-25'
    CA7:
      status: verified_with_limitations
      rule: Explanation is context dependent; materially changed records and new nonfrivolous arguments must be demonstrably considered.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_post_concepcion_propositions
      local_rule: https://www.ca7.uscourts.gov/assets/pdf/rules.pdf
      last_checked: '2026-08-25'
    CA8:
      status: verified_with_limitations
      rule: Eligibility is reviewed de novo, discretionary grant or denial for abuse of discretion, and the Act does not require a hearing.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_surviving_propositions
      local_rule: https://www.ca8.uscourts.gov/rules-procedures
      last_checked: '2026-08-25'
    CA9:
      status: verified_with_limitations
      rule: Consider nonfrivolous intervening legal or factual arguments and give a brief reason; an unexplained denial can require remand.
      publication_status: published_precedential
      intra_circuit_conflict: kelley_intervening_change_restriction_abrogated_by_concepcion_as_recognized_in_carter
      local_rule: https://www.ca9.uscourts.gov/rules/
      last_checked: '2026-08-25'
    CA10:
      status: verified_with_limitations
      rule: Section 404 is nonplenary sentence modification; no categorical hearing or presence right, abuse-of-discretion review, and a reasoned
        basis sufficient for review.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_surviving_propositions
      local_rule: https://www.ca10.uscourts.gov/clerk/rules
      last_checked: '2026-08-25'
    CA11:
      status: verified_with_limitations
      rule: Abuse-of-discretion review; no compelled reduction above the revised maximum; no collateral attack through § 404; a brief record-based
        explanation may suffice.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_post_concepcion_propositions
      local_rule: https://www.ca11.uscourts.gov/sites/default/files/courtdocs/clk/Rules_Bookmarked.DEC25.pdf
      last_checked: '2026-08-25'
    CADC:
      status: verified_with_limitations
      rule: No categorical allocution right; post-Concepcion review is deferential absent legal error, no per se reduction follows from a sentence
        above the revised maximum, and a sufficiently reasoned record can sustain denial.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_combined_propositions
      local_rule: https://www.cadc.uscourts.gov/sites/cadc/files/rules-RulesFRAP20251204.pdf
      last_checked: '2026-08-25'
