- issue_id: section-3582-procedure
  issue: § 3582 issue presentation, reconsideration, and appeal
  supreme_court_or_nationwide_rule: Section 3582(c), Rule 43, and Appellate Rule 4 supply text; issue exhaustion, reconsideration, waiver, and
    remedy remain posture- and circuit-sensitive.
  circuit_rules:
    CA1:
      status: verified_with_limitations
      rule: Nonjurisdictional claim-processing rule; whether each judicial ground must first be presented to the warden remains unresolved.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_nonjurisdictional_holding; issue_exhaustion_expressly_unresolved
      local_rule: https://www.ca1.uscourts.gov/local-rules
      last_checked: '2026-08-25'
    CA2:
      status: verified_with_limitations
      rule: Nonjurisdictional claim-processing rule that the government may waive or forfeit.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_waiver_and_forfeiture_proposition; thirty_day_route_not_decided
      local_rule: https://www.ca2.uscourts.gov/clerk/case_filing/rules/rules_home.html
      last_checked: '2026-08-25'
    CA3:
      status: verified_with_limitations
      rule: Present the motion first to the sentencing court after satisfying a statutory filing route; the premature request in Raia defeated
        first-instance appellate relief.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_first_instance_and_prematurity_propositions
      local_rule: https://www.ca3.uscourts.gov/rules-and-requirements
      last_checked: '2026-08-25'
    CA4:
      status: verified_with_limitations
      rule: Nonjurisdictional and waivable; after the initial warden request, full exhaustion or 30 days, whichever is earlier, supplies the filing
        route.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_threshold_and_alternative_routes_propositions
      local_rule: https://www.ca4.uscourts.gov/LocalRules/LocalRules.pdf
      last_checked: '2026-08-25'
    CA5:
      status: verified_with_limitations
      rule: Nonjurisdictional mandatory claim-processing rule; both routes begin with a BOP request and enforcement is required when the government
        properly invokes it.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_initial_request_and_enforcement_propositions
      local_rule: https://www.ca5.uscourts.gov/rules-procedures
      last_checked: '2026-08-25'
    CA6:
      status: verified_with_limitations
      rule: Nonjurisdictional mandatory claim-processing rule; enforce when invoked, without a judge-made futility exception, by dismissal without
        prejudice for premature filing.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_mandatory_gate_and_dismissal_propositions
      local_rule: https://www.ca6.uscourts.gov/sites/ca6/files/documents/rules_procedures/Full%20Rules%20w%20FRAP_0.pdf
      last_checked: '2026-08-25'
    CA7:
      status: verified_with_limitations
      rule: Affirmative defense and mandatory claim-processing rule; the government can forfeit it, but proper invocation requires enforcement.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_affirmative_defense_and_enforcement_propositions
      local_rule: https://www.ca7.uscourts.gov/assets/pdf/rules.pdf
      last_checked: '2026-08-25'
    CA8:
      status: verified_with_limitations
      rule: Mandatory claim-processing rule; enforce by dismissal without prejudice when raised, and the futility theory actually presented did
        not excuse compliance.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_enforcement_remedy_and_futility_propositions
      local_rule: https://www.ca8.uscourts.gov/rules-procedures
      last_checked: '2026-08-25'
    CA9:
      status: verified_with_limitations
      rule: Mandatory when invoked; a renewed motion based on changed circumstances required a new qualifying BOP request, and the filing defect
        was not cured during pendency.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_renewed_motion_and_filing_time_propositions
      local_rule: https://www.ca9.uscourts.gov/rules/
      last_checked: '2026-08-25'
    CA10:
      status: verified_with_limitations
      rule: Nonjurisdictional claim-processing rule that the government may waive or forfeit; an abandoned appellate exhaustion argument did not
        bar merits review.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_nonjurisdictional_and_appellate_waiver_propositions
      local_rule: https://www.ca10.uscourts.gov/clerk/rules
      last_checked: '2026-08-25'
    CA11:
      status: verified_with_limitations
      rule: Nonjurisdictional claim-processing rule; a court may reach the merits when the government does not assert noncompliance.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_nonjurisdictional_and_forfeiture_propositions
      local_rule: https://www.ca11.uscourts.gov/sites/default/files/courtdocs/clk/Rules_Bookmarked.DEC25.pdf
      last_checked: '2026-08-25'
