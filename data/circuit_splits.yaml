- issue_id: section-2241-coa
  issue: COA for a federal § 2241 appeal
  supreme_court_or_nationwide_rule: Section 2253(c) identifies the proceedings for which a COA is required; custody source and proceeding classification
    control.
  circuit_rules:
    CA1:
      status: verified_with_limitations
      rule: No COA for a federal prisoner's claim actually proceeding under § 2241; classification under § 2241 rather than § 2255 is separate.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca1.uscourts.gov/local-rules
      last_checked: '2026-08-25'
    CA2:
      status: verified_with_limitations
      rule: Section 2253(c) does not apply to a federal § 2241 habeas proceeding.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca2.uscourts.gov/clerk/case_filing/rules/rules_home.html
      last_checked: '2026-08-25'
    CA3:
      status: verified_with_limitations
      rule: No COA for a federal saving-clause § 2241 appeal; merits availability and proceeding classification are separate.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca3.uscourts.gov/rules-and-requirements
      last_checked: '2026-08-25'
    CA4:
      status: not_verified
      rule: Current Rule 22 and unpublished federal-prisoner dispositions were located, but no exact published precedential Fourth Circuit formulation
        was located in the bounded public-source review; no proposition is adopted.
      publication_status: not_verified
      intra_circuit_conflict: not_verified
      local_rule: https://www.ca4.uscourts.gov/LocalRules/LocalRules.pdf
      last_checked: '2026-08-25'
    CA5:
      status: verified_with_limitations
      rule: No COA for a federal prisoner properly proceeding under § 2241.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca5.uscourts.gov/rules-procedures
      last_checked: '2026-08-25'
    CA6:
      status: verified_with_limitations
      rule: No COA for a § 2241 appeal where detention arises from federal process; state-process and § 2255 categories remain distinct.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca6.uscourts.gov/sites/ca6/files/documents/rules_procedures/Full%20Rules%20w%20FRAP_0.pdf
      last_checked: '2026-08-25'
    CA7:
      status: verified_with_limitations
      rule: No COA for a federal prisoner properly proceeding under § 2241; § 2253(c)'s federal category reaches § 2255.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca7.uscourts.gov/assets/pdf/rules.pdf
      last_checked: '2026-08-25'
    CA8:
      status: verified_with_limitations
      rule: No COA for a federal prisoner effectively filing under § 2241.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca8.uscourts.gov/rules-procedures
      last_checked: '2026-08-25'
    CA9:
      status: verified_with_limitations
      rule: No COA for a person in federal custody appealing denial of a properly classified § 2241 petition.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca9.uscourts.gov/rules/
      last_checked: '2026-08-25'
    CA10:
      status: verified_with_limitations
      rule: No COA for a federal prisoner appealing a final order in a properly classified § 2241 proceeding.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca10.uscourts.gov/clerk/rules
      last_checked: '2026-08-25'
    CA11:
      status: verified_with_limitations
      rule: No COA for a federal prisoner properly proceeding under § 2241; § 2253(c)(1)(B) reaches § 2255.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_process_proposition
      local_rule: https://www.ca11.uscourts.gov/sites/default/files/courtdocs/clk/Rules_Bookmarked.DEC25.pdf
      last_checked: '2026-08-25'
    CADC:
      status: verified_with_limitations
      rule: No COA for federal-process § 2241; a COA is required for D.C. Superior Court process treated as state-court process under § 2253(c)(1)(A).
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_federal_and_dc_superior_court_distinction
      local_rule: https://www.cadc.uscourts.gov/sites/cadc/files/rules-RulesFRAP20251204.pdf
      last_checked: '2026-08-25'
