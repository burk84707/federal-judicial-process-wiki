- issue_id: section-2241-exhaustion
  issue: § 2241 administrative exhaustion
  supreme_court_or_nationwide_rule: Section 2241 contains no general exhaustion clause; 28 C.F.R. part 542 defines the BOP remedy path. The character,
    waiver, and exceptions require controlling circuit law.
  circuit_rules:
    CA1:
      status: verified_with_limitations
      rule: For a § 3585(b) sentence-credit claim, present the request first to BOP; after exhaustion, review proceeds under § 2241.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_sentence_credit_proposition
      local_rule: https://www.ca1.uscourts.gov/local-rules
      last_checked: '2026-08-25'
    CA2:
      status: verified_with_limitations
      rule: Ordinary BOP exhaustion is required; a procedural default that closes the administrative path bars review absent cause and prejudice.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_procedural_default_proposition
      local_rule: https://www.ca2.uscourts.gov/clerk/case_filing/rules/rules_home.html
      last_checked: '2026-08-25'
    CA3:
      status: verified_with_limitations
      rule: Ordinary BOP exhaustion is required; a procedural default that closes the administrative path bars review absent cause and prejudice.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_procedural_default_proposition
      local_rule: https://www.ca3.uscourts.gov/rules-and-requirements
      last_checked: '2026-08-25'
    CA4:
      status: verified_with_limitations
      rule: Exhaustion can make a § 2241 petition premature but is not jurisdictional; verified in an immigration-habeas posture, not BOP Part
        542.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_nonjurisdictional_proposition
      local_rule: https://www.ca4.uscourts.gov/LocalRules/LocalRules.pdf
      last_checked: '2026-08-25'
    CA5:
      status: verified_with_limitations
      rule: Parole Commission exhaustion is required; unavailable, wholly inappropriate, or patently futile remedies may qualify only in extraordinary
        circumstances, with the burden on the prisoner.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_parole_proposition
      local_rule: https://www.ca5.uscourts.gov/rules-procedures
      last_checked: '2026-08-25'
    CA6:
      status: verified_with_limitations
      rule: Ordinary exhaustion is required; the judge-made rule permits bounded futility, unavailable-relief, and administrator-caused-failure
        exceptions.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_parole_proposition
      local_rule: https://www.ca6.uscourts.gov/sites/ca6/files/documents/rules_procedures/Full%20Rules%20w%20FRAP_0.pdf
      last_checked: '2026-08-25'
    CA7:
      status: verified_with_limitations
      rule: Common-law exhaustion applies to § 2241; exceptions exist but the hurdle is high and self-created delay does not establish an excuse.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_common_law_proposition
      local_rule: https://www.ca7.uscourts.gov/assets/pdf/rules.pdf
      last_checked: '2026-08-25'
    CA8:
      status: verified_with_limitations
      rule: A BOP sentence-execution claim must first be presented to BOP; failure to request the available designation required dismissal without
        prejudice.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_sentence_execution_proposition
      local_rule: https://www.ca8.uscourts.gov/rules-procedures
      last_checked: '2026-08-25'
    CA9:
      status: verified_with_limitations
      rule: Prudential, nonjurisdictional, and waivable for futility under Ward v. Chavez.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_in_bounded_primary_review
      local_rule: https://www.ca9.uscourts.gov/rules/
      last_checked: '2026-08-25'
    CA10:
      status: verified_with_limitations
      rule: BOP exhaustion is a prerequisite; the futility exception is narrow and higher administrative review defeated the asserted local categorical-denial
        theory.
      publication_status: published_precedential
      intra_circuit_conflict: none_identified_for_bounded_bop_placement_proposition
      local_rule: https://www.ca10.uscourts.gov/clerk/rules
      last_checked: '2026-08-25'
    CA11:
      status: verified_with_limitations
      rule: Nonjurisdictional, ordinarily enforced when properly asserted, and need not be raised sua sponte under Santiago-Lugo.
      publication_status: published_precedential
      intra_circuit_conflict: prior_jurisdictional_descriptions_expressly_abrogated_by_published_panel
      local_rule: https://www.ca11.uscourts.gov/sites/default/files/courtdocs/clk/Rules_Bookmarked.DEC25.pdf
      last_checked: '2026-08-25'
    CADC:
      status: not_verified
      rule: No exact published D.C. Circuit rule for a federal BOP administrative-exhaustion § 2241 claim was located in the bounded public-source
        review; no proposition is adopted.
      publication_status: not_verified
      intra_circuit_conflict: not_verified
      local_rule: https://www.cadc.uscourts.gov/sites/cadc/files/rules-RulesFRAP20251204.pdf
      last_checked: '2026-08-25'
